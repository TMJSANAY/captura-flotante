name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar CapturaFlotante.exe
        shell: cmd
        run: build.cmd

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CapturaFlotante
          path: CapturaFlotante.exe

      - name: Publicar version (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CapturaFlotante.exe
          generate_release_notes: true
